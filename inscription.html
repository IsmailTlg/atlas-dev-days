<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page d'inscription a atlas dev conference">
    <link rel="stylesheet" href="css/style.css">
    <title>Atlas devs Confernece</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html"><img src="assets/icons/mainIcon.png" alt="main icon" width="50px"></a>
            <a href="programme.html" class="navBtn">Programme</a>
            <a href="intervenants.html" class="navBtn">Intervenants</a>
            <a href="inscription.html" class="navBtn">S'inscrire</a>
        </nav>
    </header>
    <main>
        <form>
            <label for="nom">Nom Complete: </label>
            <input type="text" id="nom"> <br>
            <label for="mail">Email: </label>
            <input type="text" id="mail" name="Email"> <br>
            <label for="telephone">Telephone: </label>
            <input type="text" id="telephone" name="tel"> <br>
            <label for="profile">Profile: </label>
            <select name="profile" id="profile">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select> <br>
            <input type="checkbox" id="t1">
            <label for="t1">Talk1</label>
            <input type="checkbox" id="t2">
            <label for="t2">Talk2</label>
            <input type="checkbox" id="t3"> 
            <label for="t3">Talk3</label><br>
            <input type="checkbox" id="t4">
            <label for="t4">Talk4</label>
            <input type="checkbox" id="t5">
            <label for="t5">Talk5</label>
            <input type="checkbox" id="t6">
            <label for="t6">Talk6</label> <br>
            <input type="radio" id="j1">
            <label for="j1">Jour 1</label>
            <input type="radio" id="j2">
            <label for="j2">Jour 2</label> <br>
            <input type="checkbox" id="consent">
            <label for="consent"> J’accepte les conditions de participation à<br>la conférence.</label>
            <label for="msg">Message: (Optionnel)</label> <br>
            <textarea id="msg"></textarea> <br>
            <input type="submit" id="submit" name="S'inscirire">
        </form>
        
    </main>
    <footer>
    </footer>
</body>
</html>
