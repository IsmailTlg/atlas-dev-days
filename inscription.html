<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="inscription pour attendre le conference">
    <link rel="stylesheet" href="css/style.css">
    <title>Inscription-Atlas devs Confernece</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html"><img src="assets/icons/mainIcon.png" alt="main icon - retour a l'accueil" width="50"></a>
            <a href="programme.html" class="navBtn">Programme</a>
            <a href="intervenants.html" class="navBtn">Intervenants</a>
            <a href="inscription.html" class="navBtn">S'inscrire</a>
        </nav>
    </header>
    <h1>Inscription</h1>
    <main>
        <form>
            <section class="infoperso">
            <label for="nom">Nom Complete: </label>
            <input type="text" id="nom" name="nom" required minlength="3"> <br>
            <label for="mail">Email: </label>
            <input type="email" id="mail" name="Email" required> <br>
            <label for="telephone">Telephone: </label>
            <input type="tel" id="telephone" name="tel" required pattern="^(\+212|0)[5-7][0-9]{8}$"> <br>
            <label for="profile">Profile: </label>
            <select name="profile" id="profile">
                <option value="1">Etudiant</option>
                <option value="2">Developpeur</option>
                <option value="3">Autre</option>
            </select> <br>
            <section class="checkbox">
            <input type="checkbox" id="t1" name="check" required min="3">
            <label for="t1">Talk1</label>
            <input type="checkbox" id="t2" name="check">
            <label for="t2">Talk2</label>
            <input type="checkbox" id="t3" name="check"> 
            <label for="t3">Talk3</label><br>
            <input type="checkbox" id="t4" name="check">
            <label for="t4">Talk4</label>
            <input type="checkbox" id="t5" name="check">
            <label for="t5">Talk5</label>
            <input type="checkbox" id="t6" name="check" >
            <label for="t6">Talk6</label>
            </section> <br>
            <section>
            <input type="radio" id="j1" name="jour" required>
            <label for="j1">Jour 1</label>
            <input type="radio" id="j2" name="jour">
            <label for="j2">Jour 2</label>
            <input type="radio" id="j" name="jour">
            <label for="j">Jour 1 et 2</label> <br>
            <input type="checkbox" id="consent" name="jour">
            <label for="consent"> J’accepte les conditions de participation à<br>la conférence.</label>
            <br><button type="submit" class="inscrireBtn" id = "insc">S'inscrire</button>
        </section>
            </section>
            <section class="msg">
            <label for="msg">Message: (Optionnel)</label> <br>
            <textarea id="msg"></textarea>
            </section>
        </form>
        
    </main>
    <footer>
        <h2>Contact</h2> <br>
        <section class="footerInfo">
            <a href="mailto:contact@atlasdev.ma" class="contact">contact@atlasdev.ma</a>
            <p>© 2026 Atlas Dev – Mentions légales</p>
        </section>
    </footer>
</body>
</html>
